<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>cozy-kitchen-wiki</title>
        <link rel="icon" type="image/png" href="assets/favicon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;display=swap"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="wrap">
            <header class="masthead">
                <div class="brand">
                    <img class="logo" src="assets/logo.png" alt="" />
                    <h1>Cozy Kitchen wiki</h1>
                </div>
                <div class="field lang-field">
                    <label for="language" class="sr-only" data-i18n="languageLabel">Language</label>
                    <select id="language"></select>
                </div>
            </header>

            <section class="ledger" aria-label="Totals">
                <div>
                    <div class="stat-header">
                        <span class="figure" id="stat-ingredients">–</span>
                        <span class="caption" data-i18n="ingredients">Ingredients</span>
                    </div>
                    <div class="stat-header">
                        <span class="figure" id="stat-ingredient-groups">–</span>
                        <span class="caption" data-i18n="ingredientGroup">Ingredient group</span>
                    </div>
                    <div class="stat-header">
                        <span class="figure" id="stat-collections">–</span>
                        <span class="caption" data-i18n="collections">Collections</span>
                    </div>
                </div>
                <div>
                    <div class="stat-header">
                        <span class="figure" id="stat-recipes">–</span>
                        <span class="caption" data-i18n="recipes">Recipes</span>
                    </div>
                    <div class="category-mix" id="category-mix" role="img"></div>
                    <ul class="category-legend" id="category-legend"></ul>
                </div>
            </section>
            <main class="workspace">
                <!-- Left: search + results frame (list of matches, or recipe detail) -->
                <section class="pane" aria-labelledby="search-title">
                    <h2 class="pane-title" id="search-title" data-i18n="recipes">Recipes</h2>
                    <div class="search-box" role="search">
                        <label for="search" class="sr-only" data-i18n="searchPlaceholder"
                            >Recipe or ingredient name</label
                        >
                        <input id="search" type="search" autocomplete="off" spellcheck="false" />
                    </div>
                    <div class="frame" id="search-results"></div>
                </section>

                <!-- Right: three tabs (collections, categories, ingredient groups), each with a dropdown, a short description and a list -->
                <section class="pane">
                    <div class="tabs" role="tablist">
                        <button
                            class="tab"
                            type="button"
                            role="tab"
                            id="tab-collections"
                            aria-controls="panel-collections"
                            aria-selected="true"
                            data-i18n="collections"
                        >
                            Collections
                        </button>
                        <button
                            class="tab"
                            type="button"
                            role="tab"
                            id="tab-categories"
                            aria-controls="panel-categories"
                            aria-selected="false"
                            tabindex="-1"
                            data-i18n="tabCategories"
                        >
                            Categories
                        </button>
                        <button
                            class="tab"
                            type="button"
                            role="tab"
                            id="tab-groups"
                            aria-controls="panel-groups"
                            aria-selected="false"
                            tabindex="-1"
                            data-i18n="ingredientGroup"
                        >
                            Ingredient group
                        </button>
                    </div>

                    <div class="tabpanel" role="tabpanel" id="panel-collections" aria-labelledby="tab-collections">
                        <div class="field">
                            <label for="collection" class="sr-only" data-i18n="collectionLabel">Menu collection</label>
                            <select id="collection"></select>
                        </div>
                        <div class="info-panel" id="collection-panel" hidden></div>
                        <div class="frame" id="collection-recipes"></div>
                    </div>

                    <div class="tabpanel" role="tabpanel" id="panel-categories" aria-labelledby="tab-categories" hidden>
                        <div class="field">
                            <label for="category" class="sr-only" data-i18n="categoryLabel">Category</label>
                            <select id="category"></select>
                        </div>
                        <div class="info-panel" id="category-panel" hidden></div>
                        <div class="frame" id="category-recipes"></div>
                    </div>

                    <div class="tabpanel" role="tabpanel" id="panel-groups" aria-labelledby="tab-groups" hidden>
                        <div class="field">
                            <label for="group" class="sr-only" data-i18n="ingredientGroup">Ingredient group</label>
                            <select id="group"></select>
                        </div>
                        <div class="info-panel is-group" id="group-panel" hidden></div>
                        <div class="frame" id="group-members"></div>
                    </div>
                </section>
            </main>
        </div>
        <script src="scripts.js"></script>
    </body>
</html>
